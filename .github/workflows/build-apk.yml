name: Byg Android-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installér Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installér Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Installér Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test web-appen
        run: |
          npm install --no-save --no-audit --no-fund jsdom@24.1.3
          node tests/run.js

      - name: Pak web-appen ind
        run: bash build-web.sh

      - name: Byg APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Navngiv APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Plan2028.apk

      - name: Udgiv som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Plan 2028 v1.0.${{ github.run_number }}
          make_latest: "true"
          files: Plan2028.apk
          body: |
            Download **Plan2028.apk** herunder på din Samsung og installér den.
            Nye versioner kan installeres oven på den gamle, uden at du mister dine data.

      - name: Gem APK som build-fil
        uses: actions/upload-artifact@v4
        with:
          name: Plan2028-apk
          path: Plan2028.apk
